[project]
name = "dqt"
version = "0.1.0"
description = "yet another data quality tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "pyiceberg[sql-sqlite]>=0.11.1",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
]

spark35 = [
    "pyspark>=3.5,<3.6",
]

spark40 = [
    "pyspark>=4.0,<4.1",
]