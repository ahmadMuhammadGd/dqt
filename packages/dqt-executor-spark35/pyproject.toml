[project]
name = "dqt-executor-spark35"
version = "0.1.0"
dependencies = [
    "dqt>=0.1,<0.2",
    "pyspark>=3.4,<4.0",
]

[project.entry-points."dqt.executors"]
spark35 = "dqt_executor_spark35.executor:SparkExecutionEngine"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dqt_executor_spark35"]